on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Assets

jobs:
  build:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build packages
        run: |
          mkdir -p target
          zip -r target/yEd-github-chrome.zip images background.js content.js manifest.json
          zip -r target/yEd-github-firefox.zip images background.js content.js manifest.json
          cp target/yEd-github-chrome.zip target/yEd-github.zip
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Chrome Release Asset
        id: upload-release-asset-chrome
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/yEd-github-chrome.zip
          asset_name: yEd-github-chrome.zip
          asset_content_type: application/zip
      - name: Upload Firefox Release Asset
        id: upload-release-asset-firefox
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/yEd-github-firefox.zip
          asset_name: yEd-github-firefox.zip
          asset_content_type: application/zip
      - name: Upload Default Release Asset
        id: upload-release-asset-default
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./target/yEd-github.zip
          asset_name: yEd-github.zip
          asset_content_type: application/zip
