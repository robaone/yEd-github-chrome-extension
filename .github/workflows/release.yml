on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Assets

jobs:
  build:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build packages
        run: |
          mkdir -p target
          zip -r target/yEd-github-chrome.zip images background.js content.js manifest.json
          zip -r target/yEd-github-firefox.zip images background.js content.js manifest.json
          cp target/yEd-github-chrome.zip target/yEd-github.zip
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/yEd-github-chrome.zip
            target/yEd-github-firefox.zip
            target/yEd-github.zip
