# This is a basic workflow to help you get started with Actions

name: Package Browser Extensions

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Runs a single command using the runners shell
    - name: Zip extension packages
      run: |
        mkdir -p target
        zip -r target/yEd-github-chrome.zip images background.js content.js manifest.json
        zip -r target/yEd-github-firefox.zip images background.js content.js manifest.json
        cp target/yEd-github-chrome.zip target/yEd-github.zip

    - name: Upload Chrome Extension Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yEd-github-chrome
        path: target/yEd-github-chrome.zip

    - name: Upload Firefox Extension Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yEd-github-firefox
        path: target/yEd-github-firefox.zip

    - name: Upload Default Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yEd-github
        path: target/yEd-github.zip
